<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Task 1: Bootstrap is loaded from its official CDN. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet" type="text/css">
  <title>index2 - Bootstrap activities</title>
</head>

<body>
  <!-- Task 5: Home returns to index.html and index2 identifies this page. -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Bootstrap activities</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index2.html">index2</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="mb-4">Second page</h1>

    <!-- Task 2: The same dynamic alert is available on the second page. -->
    <section class="mb-5" aria-labelledby="alert-title">
      <h2 id="alert-title" class="h4">Dynamic alert</h2>
      <button id="alertButton" class="btn btn-primary" type="button">The Button</button>
      <div id="alertContainer" class="mt-3" aria-live="polite"></div>
    </section>

    <!-- Task 3: This page also demonstrates the requested 2 + 8 + 2 grid. -->
    <section class="mb-5" aria-labelledby="layout-title">
      <h2 id="layout-title" class="h4">Grid layout</h2>
      <div class="container border rounded p-3">
        <div class="row g-3 text-center">
          <div class="col-12 col-md-2">
            <div class="grid-cell p-3 rounded">the left side</div>
          </div>
          <div class="col-12 col-md-8">
            <div class="grid-cell p-3 rounded">the centre side</div>
          </div>
          <div class="col-12 col-md-2">
            <div class="grid-cell p-3 rounded">the right side</div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col">
            <p class="bg-dark text-white text-center p-3 rounded">Footer</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Task 4: Bootstrap form with an email field, textarea, and submit button. -->
    <section aria-labelledby="form-title">
      <h2 id="form-title" class="h4">Contact form</h2>
      <form class="row g-3" action="#" method="post">
        <div class="col-12 col-md-6">
          <label for="email" class="form-label">Email</label>
          <input id="email" class="form-control" type="email" name="email" required>
        </div>
        <div class="col-12">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" class="form-control" name="message" rows="4" required></textarea>
        </div>
        <div class="col-12">
          <button class="btn btn-success" type="submit">Submit</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Task 1: The Bootstrap bundle includes the JavaScript needed by the navbar and alerts. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
