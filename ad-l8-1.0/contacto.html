<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contacta a André, desarrollador Java." />
    <title>Contacto | André Java Developer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="container py-5 text-center">
      <h1 class="titulo">Ponte en contacto</h1>
      <p class="lead mb-0">Cuéntame sobre tu próximo proyecto</p>
    </header>

    <div class="nav-bg">
      <nav class="navbar navbar-expand-lg border-bottom border-dark" aria-label="Navegación principal">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html">André Dev</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir navegación">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
              <li class="nav-item"><a class="nav-link" href="sobreMi.html">Sobre mí</a></li>
              <li class="nav-item"><a class="nav-link active fw-bold" aria-current="page" href="contacto.html">Contacto</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </div>

    <main class="container-fluid bg-light text-dark py-4">
      <div class="row g-4 min-vh-100 align-items-stretch">
        <aside class="col-12 col-lg-2 d-flex align-items-center justify-content-center border-end border-dark-subtle">
          <div class="text-center text-secondary"><span class="badge text-bg-secondary fs-6">Espacio disponible</span><p class="mt-2 mb-0">Publicidad</p></div>
        </aside>
        <section class="col-12 col-lg-8">
          <div class="card border-0 shadow-sm my-4">
            <div class="card-body p-4 p-md-5">
              <h2 class="card-title text-center mb-4">Envíame un mensaje</h2>
              <div id="mensaje-enviado" class="alert alert-success alert-dismissible fade d-none" role="alert">
                Message sent
                <button type="button" class="btn-close" id="cerrar-alerta" aria-label="Cerrar mensaje"></button>
              </div>
              <form id="contact-form">
                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="nombre@ejemplo.com" required />
                </div>
                <div class="mb-3">
                  <label for="mensaje" class="form-label">Mensaje</label>
                  <textarea class="form-control" id="mensaje" name="mensaje" rows="6" placeholder="Cuéntame cómo puedo ayudarte" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar mensaje</button>
              </form>
            </div>
          </div>
        </section>
        <aside class="col-12 col-lg-2 d-flex align-items-center justify-content-center border-start border-dark-subtle">
          <div class="text-center text-secondary"><span class="badge text-bg-secondary fs-6">Espacio disponible</span><p class="mt-2 mb-0">Noticias</p></div>
        </aside>
      </div>
    </main>

    <footer class="bg-dark text-light text-center py-4">
      <p class="mb-1">Todos los derechos reservados. André Java Developer</p>
      <p class="mb-0 text-white-50">Email: andreDev890@dominio.com</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      document.getElementById("contact-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const alert = document.getElementById("mensaje-enviado");
        alert.classList.remove("d-none");
        alert.classList.add("show");
        event.target.reset();
      });
      document.getElementById("cerrar-alerta").addEventListener("click", () => {
        const alert = document.getElementById("mensaje-enviado");
        alert.classList.remove("show");
        alert.classList.add("d-none");
      });
    </script>
  </body>
</html>
