
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tareas de Bootstrap</title>

    <!-- Tarea 1: Bootstrap CSS mediante CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Contenedor de anchura variable -->
    <div class="container-fluid mt-4">

        <!-- TAREA 3: BOTONES Y COLORES -->
        <h2 class="mb-3">Botones y colores</h2>

        <div class="d-flex flex-wrap gap-3 mb-4">

            <button type="button" class="btn btn-primary">
                Botón azul
            </button>

            <button type="button" class="btn btn-success">
                Botón verde
            </button>

            <button type="button" class="btn btn-danger">
                Botón rojo
            </button>

        </div>

        <hr>

        <!-- TAREA 4: ALINEACIÓN DE TEXTO -->
        <h2 class="mb-3">Alineación de texto</h2>

        <p class="text-start">
            Izquierda
        </p>

        <p class="text-center text-danger">
            Centro
        </p>

        <p class="text-end">
            Derecha
        </p>

        <hr>

        <!-- TAREA 5: TARJETA CON GRUPO DE LISTAS -->
        <h2 class="mb-3">Tarjeta con lista de frutas</h2>

        <div class="card mb-4" style="width: 18rem;">

            <!-- Encabezado de la tarjeta -->
            <div class="card-header">
                Hoja de ruta
            </div>

            <!-- Imagen de una cesta de frutas -->
            <img
                src="frutas.png"
                class="card-img-top"
                alt="Imagen ilustrativa de una cesta de frutas"
            >

            <!-- Grupo de lista -->
            <ul class="list-group list-group-flush">
                <li class="list-group-item">Manzana</li>
                <li class="list-group-item">Naranja</li>
                <li class="list-group-item">Plátano</li>
            </ul>

        </div>

    </div>

    <!-- Tarea 1: Bootstrap JavaScript mediante CDN -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
