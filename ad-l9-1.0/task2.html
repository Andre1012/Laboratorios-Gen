      <main class="page-shell narrow">

        <section class="panel">
          <p class="eyebrow">Task 02</p>
          <h1>Read a form</h1>
          <form id="form1">
            <label for="first-name">First name</label>
            <input id="first-name" type="text" name="fname" value="David" required>

            <input id="last-name" type="text" name="lname" value="Beckham" required>

          </form>

        </section>
